    <script>
      (function() {
        var _warn = console.warn;
        var _err = console.error;
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket'))) return;
          _warn.apply(console, arguments);
        };
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('vite-plugin-pwa:dev-ready'))) return;
          _err.apply(console, arguments);
        };
      })();
    </script>
